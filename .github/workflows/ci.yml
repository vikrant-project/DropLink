name: DropLink Cross-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows App and Installer
        shell: powershell
        run: |
          cargo build --release --target-dir target -p droplink-windows
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "target/release/droplink-windows.exe" -Destination "dist/DropLink-Portable.exe" -Force
          cargo build --release --target-dir target -p droplink-installer

  build-android:
    name: Build Android Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Wrapper and Build Android APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

  build-ios:
    name: Build iOS Application
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build iOS App
        run: |
          cd ios
          xcodebuild build \
            -project DropLink.xcodeproj \
            -scheme DropLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
